# 매일 정해진 시각에 대시보드 데이터를 모아서 data/에 커밋합니다.
# GitHub 사정에 따라 예약 시각보다 몇 분~몇십 분 늦게 실행될 수 있습니다.
name: 데이터 수집

on:
  schedule:
    # cron은 UTC 기준입니다 (한국 시간 = UTC + 9시간)
    - cron: "0 22 * * *" # 한국 07:00 — 미국 장 마감 후, 한국 장 시작 전 (오늘 날씨·미국 종가)
    - cron: "10 7 * * *" # 한국 16:10 — 한국 장 마감 후 (코스피·코스닥 종가)
  workflow_dispatch: # Actions 화면의 "Run workflow" 버튼으로 직접 실행
    inputs:
      force_fail:
        description: "실패 알림 시험: 일부러 실패시킬 출처 (예: weather,fx). 비우면 평소처럼 수집. 시험 실행은 데이터를 커밋하지 않음"
        required: false
        default: ""

permissions:
  contents: write # data/ 커밋과 푸시에 필요
  pages: write # 봇 푸시 뒤 Pages 다시 배포 요청에 필요
  issues: write # 수집 실패 이슈 등록·닫기에 필요

env:
  FAIL_LABEL: 수집 실패

# 두 번 겹쳐 실행되면 나중 것이 앞의 것을 기다립니다 (동시에 푸시하다 충돌하지 않게)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 수집과 커밋
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 출처 하나가 실패해도 나머지 결과는 저장해야 하므로, 실패를 기록만 하고 다음 단계로 갑니다.
      - name: 수집
        id: collect
        env:
          COLLECT_FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          # 결과 줄(✅/❌)을 collect.log에도 남겨서 실패 이슈 본문에 쓴다
          set -o pipefail
          failed=false; invalid=false
          # 수집기는 출처별로 값을 검사해서, 이상한 출처만 실패로 바꾸고(직전 값 유지) 나머지는 저장한다.
          npm run -s collect 2>&1 | tee collect.log || failed=true
          # 마지막 안전장치: 파일 전체를 다시 검사한다. 여기서 걸리면 커밋하지 않는다(사이트는 직전 값 유지).
          npm run -s validate 2>&1 | tee -a collect.log || { invalid=true; failed=true; }
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "invalid=$invalid" >> "$GITHUB_OUTPUT"

      - name: 바뀐 데이터 커밋
        id: commit
        # 실패 알림 시험 실행(일부러 망가뜨린 결과)과 검사에 걸린 데이터는 커밋하지 않는다
        if: inputs.force_fail == '' && steps.collect.outputs.invalid != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # 수집 시각(generatedAt/updatedAt/failedAt)만 바뀐 경우는 커밋하지 않는다
          if ! git diff --cached -U0 data/ | grep -E '^[+-] ' | grep -vqE '"(generatedAt|updatedAt|failedAt)"'; then
            echo "값이 바뀐 데이터 없음 (시각만 바뀜)"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="data: 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git commit -q -m "$msg"
          # 그사이 main에 다른 커밋이 들어왔으면 그 위에 얹는다.
          # data/가 충돌하면 최신 main에서 한 번 더 수집해서 다시 커밋한다 (이번 수집 결과를 잃지 않게).
          if ! git pull --rebase origin main; then
            echo "::warning::data/ 충돌 — 최신 main에서 다시 수집합니다"
            git rebase --abort
            git reset -q --hard origin/main
            npm run collect || echo "failed=true" >> "$GITHUB_OUTPUT"
            if ! npm run -s validate; then
              echo "failed=true" >> "$GITHUB_OUTPUT"
              echo "::error::다시 수집한 데이터가 검사에 걸려서 커밋하지 않습니다"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add data/
            git diff --cached --quiet || git commit -q -m "$msg"
          fi
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN으로 한 푸시는 다른 워크플로를 깨우지 않을 수 있어서, Pages 배포를 직접 요청한다.
      - name: Pages 다시 배포 요청
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::Pages 배포 요청 실패"

      # 실패하면 "수집 실패" 이슈를 하나 열어 두고(이미 열려 있으면 댓글만 추가),
      # 모두 성공하면 열려 있던 이슈에 "복구됨" 댓글을 달고 닫는다. 이슈가 쌓이지 않게 항상 하나만 쓴다.
      - name: 실패 이슈 등록 또는 복구 시 닫기
        if: always() && steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # 수집 실패, 다시 수집 중 실패, 푸시 실패 중 하나라도 있으면 "실패"
          FAILED: ${{ steps.collect.outputs.failed == 'true' || steps.commit.outputs.failed == 'true' || steps.commit.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RUN: ${{ inputs.force_fail != '' }}
        run: |
          gh label create "$FAIL_LABEL" --color D93F0B --description "자동 데이터 수집 실패 알림" --force >/dev/null
          issue=$(gh issue list --label "$FAIL_LABEL" --state open --limit 1 --json number -q '.[0].number')
          now="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          if [ "$FAILED" = "true" ]; then
            {
              [ "$TEST_RUN" = "true" ] && echo "> 🧪 **시험 실행**이에요 (일부러 실패시킨 출처가 있어요). 데이터는 커밋하지 않았어요."
              echo "**$now** 수집에서 실패한 출처가 있어요. 대시보드에는 직전에 성공한 값이 표시돼요."
              echo
              echo '```'
              grep -E '^(❌|⚠️|Error|  - )' collect.log > failures.txt || echo "(출처 실패 없음 — 데이터 저장·푸시 단계 실패. 실행 기록 확인)" > failures.txt
              cat failures.txt
              echo '```'
              echo
              echo "실행 기록: $RUN_URL"
            } > body.md
            if [ -n "$issue" ]; then
              # 같은 실패가 계속되면 댓글을 반복하지 않는다 (알림 폭탄 방지). 실패한 출처 이름이 달라졌을 때만 댓글.
              names() { grep -oE '^(❌|⚠️) [^:]+' | sort -u; }
              last=$(gh issue view "$issue" --json body,comments -q '([.body] + [.comments[].body]) | last')
              if [ "$(names < failures.txt)" = "$(printf '%s\n' "$last" | names)" ] && [ "$TEST_RUN" != "true" ]; then
                echo "이슈 #$issue: 지난번과 같은 실패라 댓글 생략"
              else
                gh issue comment "$issue" --body-file body.md
              fi
            else
              {
                cat body.md
                echo
                echo "---"
                echo "모든 출처가 다시 성공하면 이 이슈는 자동으로 닫혀요. 같은 문제가 계속되면 이 이슈에 댓글이 이어서 달려요."
              } > new.md
              gh issue create --title "데이터 수집 실패" --label "$FAIL_LABEL" --body-file new.md
            fi
          elif [ -n "$issue" ] && [ "$TEST_RUN" != "true" ]; then
            # 시험 실행은 데이터를 커밋하지 않으므로 "복구"로 치지 않는다
            gh issue comment "$issue" --body "✅ **$now** 수집에서 모든 출처가 다시 성공해서 닫아요. 실행 기록: $RUN_URL"
            gh issue close "$issue" --reason completed
          fi

      # 저장은 끝냈으니, 실패한 출처가 있었다면 여기서 실패로 표시합니다 (Actions에 ❌).
      - name: 실패한 출처 확인
        if: steps.collect.outputs.failed == 'true' || steps.commit.outputs.failed == 'true'
        run: |
          echo "::error::실패한 출처가 있습니다. '수집' 단계 로그의 ❌ 줄을 확인하세요."
          exit 1
