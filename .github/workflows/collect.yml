# 매일 정해진 시각에 대시보드 데이터를 모아서 data/에 커밋합니다.
# GitHub 사정에 따라 예약 시각보다 몇 분~몇십 분 늦게 실행될 수 있습니다.
name: 데이터 수집

on:
  schedule:
    # cron은 UTC 기준입니다 (한국 시간 = UTC + 9시간)
    - cron: "0 22 * * *" # 한국 07:00 — 미국 장 마감 후, 한국 장 시작 전 (오늘 날씨·미국 종가)
    - cron: "10 7 * * *" # 한국 16:10 — 한국 장 마감 후 (코스피·코스닥 종가)
  workflow_dispatch: # Actions 화면의 "Run workflow" 버튼으로 직접 실행

permissions:
  contents: write # data/ 커밋과 푸시에 필요

# 두 번 겹쳐 실행되면 나중 것이 앞의 것을 기다립니다 (동시에 푸시하다 충돌하지 않게)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 수집과 커밋
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 출처 하나가 실패해도 나머지 결과는 저장해야 하므로, 실패를 기록만 하고 다음 단계로 갑니다.
      - name: 수집
        id: collect
        run: |
          if npm run collect; then echo "failed=false" >> "$GITHUB_OUTPUT"
          else echo "failed=true" >> "$GITHUB_OUTPUT"; fi

      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "data: 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 그사이 main에 다른 커밋이 들어왔으면 그 위에 얹어서 푸시
          git pull --rebase origin main
          git push origin HEAD:main

      # 저장은 끝냈으니, 실패한 출처가 있었다면 여기서 실패로 표시합니다 (Actions에 ❌).
      - name: 실패한 출처 확인
        if: steps.collect.outputs.failed == 'true'
        run: |
          echo "::error::실패한 출처가 있습니다. '수집' 단계 로그의 ❌ 줄을 확인하세요."
          exit 1
